server {
    listen 443 ssl;
    server_name webhook-vip.example.edu mist-userid-01.EXAMPLE.EDU;

    ssl_certificate     /etc/pki/tls/certs/mist-userid.crt;
    ssl_certificate_key /etc/pki/tls/private/mist-userid.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Only expose the webhook and health endpoints
    location /mist/webhook {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mist webhooks are small JSON payloads
        client_max_body_size 1m;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location /ready {
        proxy_pass http://127.0.0.1:8000;
    }

    # Deny everything else
    location / {
        return 404;
    }
}
