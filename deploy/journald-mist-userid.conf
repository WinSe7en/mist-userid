# Install to /etc/systemd/journald.conf.d/mist-userid.conf
# Without /var/log/journal, RHEL 9 journald stays in RAM and holds only ~8 hours
# of logs at ~200K webhooks/day, so `journalctl --since` can't look back further.
# Volume is ~215MB/day (mostly httpx per-request INFO lines). /var/log is a
# separate 5G volume shared with rsyslog (~3G of /var/log/messages*), so cap
# at 1G (~4-5 days). For older history use /var/log/messages* (~4 weeks).
[Journal]
Storage=persistent
SystemMaxUse=1G
