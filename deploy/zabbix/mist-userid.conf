# Zabbix UserParameter definitions for mist-userid
# Install to: /etc/zabbix/zabbix_agentd.d/mist-userid.conf
# Then restart: systemctl restart zabbix-agent
#
# Note: Metrics from /metrics endpoint are from the API process only.
# Worker-specific metrics (PA requests/errors) are not exposed via HTTP.
# Use Redis-based metrics for the most reliable queue/event data.

# -----------------------------------------------------------------------------
# Health Checks (1=healthy, 0=unhealthy)
# -----------------------------------------------------------------------------
UserParameter=mist.userid.api.health,curl -sf http://localhost:8000/health >/dev/null 2>&1 && echo 1 || echo 0
UserParameter=mist.userid.worker.health,systemctl is-active mist-userid-worker >/dev/null 2>&1 && echo 1 || echo 0

# -----------------------------------------------------------------------------
# Queue Metrics (from Redis - most reliable source)
# -----------------------------------------------------------------------------
UserParameter=mist.userid.queue.depth,redis-cli LLEN userid_queue 2>/dev/null || echo 0
UserParameter=mist.userid.dlq.depth,redis-cli LLEN userid_dlq 2>/dev/null || echo 0
UserParameter=mist.userid.dedup.keys,redis-cli KEYS 'dedup:*' 2>/dev/null | wc -l

# -----------------------------------------------------------------------------
# Event Counters (from API /metrics endpoint)
# Some metrics have labels - we sum all values
# -----------------------------------------------------------------------------
# Events received by API (by topic: client-sessions, client-join)
UserParameter=mist.userid.events.received,curl -s http://localhost:8000/metrics 2>/dev/null | awk '/^mist_userid_events_received_total\{/{s+=$NF}END{print int(s)}'

# Events queued to Redis
UserParameter=mist.userid.events.queued,curl -s http://localhost:8000/metrics 2>/dev/null | awk '/^mist_userid_events_queued_total /{print int($2)}'

# Events rejected (by reason: no_username, no_ip, ignored_ssid)
UserParameter=mist.userid.events.rejected,curl -s http://localhost:8000/metrics 2>/dev/null | awk '/^mist_userid_events_rejected_total\{/{s+=$NF}END{print int(s)}'

# Events skipped by dedup cache
UserParameter=mist.userid.events.deduped,curl -s http://localhost:8000/metrics 2>/dev/null | awk '/^mist_userid_events_deduped_total /{print int($2)}'

# DLQ counter (events dead-lettered after retry exhaustion)
UserParameter=mist.userid.dlq.total,curl -s http://localhost:8000/metrics 2>/dev/null | awk '/^mist_userid_dlq_events_total /{print int($2)}'

# Queue depth gauge (from /metrics - same as Redis LLEN but via API)
UserParameter=mist.userid.queue.gauge,curl -s http://localhost:8000/metrics 2>/dev/null | awk '/^mist_userid_queue_depth /{print int($2)}'

# -----------------------------------------------------------------------------
# Service Memory (from systemd, in bytes)
# -----------------------------------------------------------------------------
UserParameter=mist.userid.api.memory,systemctl show mist-userid-api --property=MemoryCurrent --value 2>/dev/null | grep -v '^\[' || echo 0
UserParameter=mist.userid.worker.memory,systemctl show mist-userid-worker --property=MemoryCurrent --value 2>/dev/null | grep -v '^\[' || echo 0

# -----------------------------------------------------------------------------
# PA Certificate Expiry (days remaining; -1 = unreadable)
# Create one item per PA target, e.g.:
#   mist.userid.cert.days[pa-fw-01.mgmt.example.edu]
#   mist.userid.cert.days[pa-fw-02.mgmt.example.edu]
# Suggested trigger: last() < 30  (warning), last() < 7 (high)
# An expired cert took a PA target out of rotation for a week in May 2026.
# -----------------------------------------------------------------------------
UserParameter=mist.userid.cert.days[*],/opt/mist-userid/scripts/check_pa_certs.sh days $1
