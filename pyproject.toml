[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mist-userid"
version = "0.3.2"
description = "High-throughput webhook receiver for Juniper Mist to Palo Alto User-ID integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Matt Johnson" },
]
keywords = [
    "mist",
    "juniper",
    "palo-alto",
    "user-id",
    "webhook",
    "firewall",
    "network",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.0",
    "redis[hiredis]>=8.0.0",
    "pydantic-settings>=2.14.2",
    "sdnotify>=0.3.2",
    "prometheus-client>=0.25.0",
    "python-json-logger>=4.0.0",
    # Transitive via fastapi, floored for PYSEC-2026-248/249
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "fakeredis[lua]>=2.36.0",
    "locust>=2.44.0",
]

[project.scripts]
mist-userid-worker = "app.worker:main"

[project.urls]
Homepage = "https://github.com/WinSe7en/mist-userid"
Documentation = "https://github.com/WinSe7en/mist-userid#readme"
Repository = "https://github.com/WinSe7en/mist-userid.git"
Issues = "https://github.com/WinSe7en/mist-userid/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
